project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - analysis/*.qmd
    # Guadalajara data belongs to the collaborators (Prof. Jesus / Bere team); keep
    # these off the public site. Delivered separately in docs/analysis/zealqtl/ (gitignored).
    # Photoperiod GxE stays public (per Ruben: photoperiod can be part of ZEAL).
    - "!analysis/zeal-rqtl-cucbadta-lod-profile.qmd"
    - "!analysis/zeal-rqtl-cucbadts-lod-profile.qmd"
    - "!analysis/zeal-rqtl-fw-jal-lod-profile.qmd"
    - "!analysis/zeal-rqtl-ph-jal-lod-profile.qmd"
    - "!analysis/zeal-rqtl-eh-jal-lod-profile.qmd"
    - "!analysis/zeal-rqtl-en-jal-lod-profile.qmd"
    - "!analysis/zeal-rqtl-inc-jal-lod-profile.qmd"
    - "!analysis/zeal-rqtl-sev-jal-lod-profile.qmd"
    - analysis/*.md
    - DATA.md

# project-wide HTML defaults: hide code by default, offer a top-right
# "</> Code" menu to show all code or view/download the complete .qmd source.
# Per-notebook YAML can still override any of these.
format:
  html:
    code-fold: true
    code-summary: "Show code"
    code-tools:
      toggle: true
      source: true

# freeze executed results so format-only re-renders don't re-run heavy chunks
execute:
  freeze: auto

website:
  title: "zealhmm"
  description: "Teosinte-introgression QTL recovery — TeoNAM & ZEAL"
  search: true
  page-navigation: true
  navbar:
    background: dark
    title: false
    left:
      - text: "zealhmm"
        href: https://github.com/sawers-rellan-labs/zealhmm
      - text: "Home"
        href: index.html
      - text: "Data provenance"
        href: DATA.html
